[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "tunhub"
dynamic = ["version"]
description = "Open the web UIs on your private network like any public website: tunhub sets up the SSH forwarding for you."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Liuk Diih Mieu" }]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "PyYAML>=6.0",
]
keywords = [
    "ssh", "ssh-tunnel", "port-forwarding", "self-hosted", "homelab",
    "dashboard", "localhost", "remote-access", "jupyter", "nas",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: System Administrators",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: Proxy Servers",
    "Topic :: System :: Networking",
    "Topic :: Utilities",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
tunhub = "tunhub.cli:main"

[project.urls]
Homepage = "https://github.com/LiukDiihMieu/tunhub"
Issues = "https://github.com/LiukDiihMieu/tunhub/issues"
Changelog = "https://github.com/LiukDiihMieu/tunhub/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "tunhub/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["tunhub", "tests", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.hatch.build.targets.wheel]
packages = ["tunhub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
