<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>tunhub</title>
  <link rel="icon" id="favicon" type="image/svg+xml" href="/static/icons/favicon.svg">
  <link rel="alternate icon" type="image/png" href="/static/icons/favicon-32.png">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
  <link rel="manifest" href="/static/manifest.webmanifest">
  <meta name="theme-color" content="#0a1024">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <!-- The mark (see tools/make_icons.py); colours follow the theme via CSS. -->
      <svg class="logo" viewBox="18 26 92 68" aria-hidden="true">
        <path class="logo-line" d="M30 80H98"/>
        <path class="logo-arc" d="M30 80A34 34 0 0 1 46.406 50.906M81.594 50.906A34 34 0 0 1 98 80"/>
        <path class="logo-rim" d="M64 31L79 46L64 61L49 46Z"/>
        <path class="logo-core" d="M64 37.5L72.5 46L64 54.5L55.5 46Z"/>
        <circle class="logo-node" cx="30" cy="80" r="9"/>
        <circle class="logo-node" cx="98" cy="80" r="9"/>
      </svg>
      <h1>tunhub</h1>
      <span id="client" class="muted"></span>
    </div>
    <div class="topbar-actions">
      <span id="summary" class="muted"></span>
      <button id="disconnect-ssh" class="btn ghost stop" title="Stop every service using ssh; direct connections stay up" disabled>Disconnect SSH</button>
      <button id="reload" class="btn ghost" title="Re-read services.yaml and local.yaml">Reload config</button>
    </div>
  </header>

  <div id="banner" class="banner" hidden></div>

  <main id="services" class="grid"></main>

  <!-- Front of a service: launch by clicking the icon. -->
  <template id="tile-template">
    <article class="tile">
      <button class="more" aria-label="Details" title="Details">⋯</button>
      <a class="launch">
        <span class="icon"></span>
        <span class="name"></span>
      </a>
      <div class="status"><span class="dot" aria-hidden="true"></span><span class="state-text"></span><span class="identity-warn" hidden>⚠</span></div>
      <code class="tcp-address" hidden></code>
      <button class="btn small stop" hidden>Stop</button>
    </article>
  </template>

  <!-- Details drawer: everything that is not needed every day. -->
  <aside id="drawer" class="drawer" hidden aria-label="Service details">
    <div class="drawer-head">
      <span class="icon" id="d-icon"></span>
      <div class="drawer-title">
        <h2 id="d-name"></h2>
        <div class="status"><span class="dot" id="d-dot" aria-hidden="true"></span><span id="d-state"></span></div>
      </div>
      <button class="more" id="d-close" aria-label="Close" title="Close (Esc)">✕</button>
    </div>

    <p id="d-error" class="error" hidden></p>
    <p id="d-identity" class="identity" hidden></p>

    <dl class="fields">
      <dt>Address</dt>
      <dd><code id="d-address"></code><button class="icon-btn" id="d-copy-address">Copy</button></dd>
      <dt>Bookmark</dt>
      <dd><code id="d-bookmark"></code><button class="icon-btn" id="d-copy-bookmark">Copy</button></dd>
      <dt>Route</dt>
      <dd><select id="d-route"></select></dd>
      <dt>Active</dt>
      <dd id="d-route-active" class="muted"></dd>
    </dl>

    <div class="actions">
      <button id="d-toggle" class="btn"></button>
      <button id="d-refresh-icon" class="btn ghost">Refresh icon</button>
    </div>

    <h3>Log</h3>
    <pre id="d-log" class="log"></pre>
  </aside>

  <div id="toast" class="toast" role="status" hidden></div>

  <script src="/static/app.js"></script>
</body>
</html>
