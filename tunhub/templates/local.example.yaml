# Overrides for ONE machine. Copy this file to local.<machine>.yaml, where
# <machine> is the name the dashboard shows next to its title (this machine's
# host name, lowercased, up to the first dot; set TUNHUB_MACHINE or pass
# --machine to choose another). Each machine reads only its own file, so the whole config
# directory can be synced between machines.
#
# The file is merged on top of services.yaml: mappings key by key, while lists
# (such as `routes`) replace the shared ones entirely.
#
# Keep services.yaml the same for every machine. Put here only what really
# differs on this machine; pick the parts you need.

services:
  # This machine IS the workstation from services.yaml: reach Jupyter on
  # this machine directly (127.0.0.1 is this machine, so it belongs here,
  # never in the shared file) ...
  jupyter:
    routes:
      - direct: 127.0.0.1:8888
  # ... and do not offer a remote desktop to itself.
  desktop:
    enabled: false

  # The shared local port is already taken on this machine.
  # nas:
  #   local_port: 25000

  # Connect when tunhub starts, on this machine only.
  # nas:
  #   autostart: true

# This machine's ssh program differs (e.g. Windows OpenSSH by full path).
# tunnel:
#   ssh_command: [C:/Windows/System32/OpenSSH/ssh.exe]
